<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Pulse | Local dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-frame">
    <aside class="sidebar" aria-label="Pulse dashboard">
      <a class="brand" href="#overview" aria-label="Pulse dashboard home">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>Pulse<span class="brand-subtitle">LOCAL WORKSPACE</span></span>
      </a>
      <p class="nav-heading">Workspace</p>
      <nav class="section-nav" aria-label="Dashboard sections" role="tablist" aria-orientation="vertical">
        <button class="nav-item active" id="tab-overview" role="tab" aria-selected="true" aria-controls="overview" tabindex="0" data-tab="overview"><span class="nav-index">01</span>Overview</button>
        <button class="nav-item" id="tab-profile" role="tab" aria-selected="false" aria-controls="profile" tabindex="-1" data-tab="profile"><span class="nav-index">02</span>User profile</button>
        <button class="nav-item" id="tab-digests" role="tab" aria-selected="false" aria-controls="digests" tabindex="-1" data-tab="digests"><span class="nav-index">03</span>Digest calendar</button>
        <button class="nav-item" id="tab-learning" role="tab" aria-selected="false" aria-controls="learning" tabindex="-1" data-tab="learning"><span class="nav-index">04</span>PulseDev calendar</button>
      </nav>
      <div class="sidebar-foot">
        <span class="local-mark">LOCAL · READ ONLY</span>
        <p>Pulse data stays in this checkout.</p>
      </div>
    </aside>

    <main class="main-area" id="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-separator">/</span><strong id="current-section">Overview</strong></div>
        <div class="sync-state"><span class="sync-icon" aria-hidden="true"></span><span id="updated">Connecting to local data</span></div>
      </header>
      <div class="mobile-nav-wrap">
        <nav class="mobile-nav" aria-label="Dashboard sections" role="tablist" aria-orientation="horizontal">
          <button class="nav-item active" role="tab" aria-selected="true" aria-controls="overview" tabindex="0" data-tab="overview">Overview</button>
          <button class="nav-item" role="tab" aria-selected="false" aria-controls="profile" tabindex="-1" data-tab="profile">Profile</button>
          <button class="nav-item" role="tab" aria-selected="false" aria-controls="digests" tabindex="-1" data-tab="digests">Digest calendar</button>
          <button class="nav-item" role="tab" aria-selected="false" aria-controls="learning" tabindex="-1" data-tab="learning">PulseDev calendar</button>
        </nav>
      </div>

      <div class="content-wrap">
        <div id="loading" class="loading-state" role="status" aria-live="polite">
          <span class="loading-line wide"></span><span class="loading-line"></span>
          <div class="loading-block"></div><p>Loading local Pulse data</p>
        </div>
        <div id="error" class="notice notice-error hidden" role="alert"></div>
        <section id="overview" class="page active" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
        <section id="profile" class="page" role="tabpanel" aria-labelledby="tab-profile" tabindex="0" hidden></section>
        <section id="digests" class="page" role="tabpanel" aria-labelledby="tab-digests" tabindex="0" hidden></section>
        <section id="learning" class="page" role="tabpanel" aria-labelledby="tab-learning" tabindex="0" hidden></section>
        <footer class="app-footer"><span>Pulse local viewer</span><span>Read-only view · <code>LEARNING_LOG_PATH</code> supplies profile and proof data</span></footer>
      </div>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
