name: Validate learning picks

on:
  push:
    paths:
      - "picks/**"
      - "_template/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Validate completed picks and rebuild index
        run: python .github/scripts/validate_picks.py
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update generated learning index"
          git push
